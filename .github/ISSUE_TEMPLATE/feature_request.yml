name: 功能建议
description: 提一个功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先看一眼：这个项目以「可验证」为准绳——如果这条建议能写清
        「怎么算做成了」（判据），优先级会高很多。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景，再说方案。直接给方案容易错过更简单的解法
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过哪些替代方案 / 现在怎么绕过的

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - DSP 信号链（升频 / 抖动 / SDM / 卷积 / PEQ）
        - 输出后端（CoreAudio / DoP / UPnP）
        - 界面与交互
        - 元数据 / 封面 / AI 整理
        - 音频体检 / 房间校正
        - 构建 / 打包 / 更新
        - 其他

  - type: textarea
    id: evidence
    attributes:
      label: 可验证的判据（可选）
      description: 如果能说出「怎么算做成了」，这条建议的优先级会高很多
      placeholder: 例：升频到 384k 后阻带应 ≥ −180 dB，可用 ctest 现有用例复测
